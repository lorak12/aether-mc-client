[package]
name = "aether-launcher"
version = "0.1.0"
edition = "2021"

[lib]
name = "aether_launcher_lib"
crate-type = ["rlib"]
# No unit tests here (logic lives in aether-core). Windows test executables lack the comctl32 v6 manifest the
# tray and dialog code needs, so they would fail to start with STATUS_ENTRYPOINT_NOT_FOUND.
test = false
doctest = false

[[bin]]
name = "aether-launcher"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
aether-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
futures = "0.3"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
