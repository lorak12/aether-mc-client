name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy: { matrix: { os: [ubuntu-latest, windows-latest, macos-latest] } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix launcher/ui ci || npm --prefix launcher/ui install
      - run: npm --prefix launcher/ui run build
      - run: cargo test -p aether-core
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd backend && npm install && npm run typecheck && npm test
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cd runtime && ./gradlew test
